<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEPFLAT stills</title>
<!-- Still renders for the DEEPFLAT page (not part of the page itself).
     ?scene=brand                       the brand-section vignette (portrait)
     ?scene=home&slug=<slug>&shot=NN    a project image: 01 = cutaway overview, 02.. = room close-ups (see shots.js)
     ?scene=flight&shot=<scene>         a hero scene for the static hero: world, living, kitchen, bedroom (see flight.js)
     ?scene=carousel&room=<room>        a cutaway room for the brand section's carousel: living, kitchen, bedroom, study,
                                        bath (see carousel.js; rendered by render-carousel.mjs)
     &samples=N  frames averaged (default 48)   &debug=1  one fast frame
     When the image is done, window.__stillReady is true (window.__stillError holds a message if it failed). -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #status { position: fixed; left: 8px; bottom: 6px; font: 12px/1.3 system-ui, sans-serif; color: #9a948a; }
  body.done #status { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">building…</div>
<script type="module" src="./stills.js"></script>
</body>
</html>
